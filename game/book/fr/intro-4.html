Des volcans se mirent en éruption et schtroumpfèrent de la lave schtroumpfante, des montagnes s'élevèrent, des valées formèrent, et ainsi schtroumpfa le Pays Maudit. L'eau schtroumpfante des montagnes forma des ruisseaux, des rivières et des lacs.
