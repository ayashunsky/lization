Le Schtroumpf grognon n'aime schtroumpfer grand-chose, mais ses capacités sont celles d'un schtroumpf ordinaire. Il peut donc marcher, attendre, cueillir, planter, bâtir et ramasser des matériaux comme n'importe quel autre villageois.
