<p>
<img data-book-bind-src="unit.costaud.icon" data-book-bind-alt="unit.costaud.label" style="width: 30%; float: right; margin-left: 1em;">
Le Schtroumpf costaud porte les charges que d'autres laisseraient là. Il est plus endurant qu'un schtroumpf ordinaire et travaille un peu plus vite pour bâtir, démolir ou extraire des matériaux. Une telle vigueur lui ouvre l'appétit&nbsp;: il mange environ deux fois plus.
