<p>
<img src="../images/runes.png" style="width: 40%; float: right; margin-left: 1em;">
Les runes servent à noter des signes anciens et à transmettre un savoir difficile à retenir
seulement de mémoire. Elles ouvrent la voie à des pratiques plus savantes et à une lecture 
plus fine du monde. Sans runes les savoirs plus avancés sont inaccéssibles.
