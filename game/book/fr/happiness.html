<h2 class="book-page-title">Bonheur</h2>
<p>
<img src="../images/happiness.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Le bonheur reflète le moral du village. Il évolue avec les réserves de nourriture et la taille de la population. Les Schtroumpfs qui ne travaillent pas et certains bâtiments peuvent l'améliorer.
</p>
<p>Quand le bonheur baisse, la récolte, la construction et la recherche avancent moins vite.</p>
