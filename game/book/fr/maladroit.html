<h2 class="book-page-title" data-book-bind="unit.maladroit.label"></h2>
<p>
<img src="../images/generic_unit_3q.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Le Schtroumpf maladroit veut bien aider, mais tout lui échappe des mains. Il peut accomplir les tâches ordinaires du village. Son rendement, comparé à celui d'un schtroumpf ordinaire, est de ×<span data-book-ratio="unit.maladroit.workPointsPerTurn.buildHouse" data-book-ratio-base="unit.default.workPointsPerTurn.buildHouse"></span> pour bâtir, ×<span data-book-ratio="unit.maladroit.workPointsPerTurn.gatherFood" data-book-ratio-base="unit.default.workPointsPerTurn.gatherFood"></span> pour récolter et ×<span data-book-ratio="unit.maladroit.workPointsPerTurn.gatherMaterials" data-book-ratio-base="unit.default.workPointsPerTurn.gatherMaterials"></span> pour extraire des matériaux.
</p>
