<h2 class="book-page-title" data-book-bind="unit.bricoleur.label"></h2>
<p>
<img src="../images/bricoleur.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Le Schtroumpf Bricoleur schtroumpfe avec les mains. Il sait poser des fondations spéciales et mener des recherches. En revanche, il ne se charge pas des récoltes. Un atelier multiplie sa recherche par <span data-book-ratio="rules.units.types.bricoleur.modifiers.0.set.researchPointsPerTurn" data-book-ratio-base="unit.bricoleur.researchPointsPerTurn"></span>.
</p>
