<h2 class="book-page-title" data-book-bind="unit.cuisinier.label"></h2>
<p>
<img src="../images/cuisinier.png" alt="" style="width: 42%; float: right; margin-left: 1em;">
El Pitufo Cocinero se dedica a la comida. Puede caminar, esperar, recolectar y sembrar, pero no construir ni extraer materiales. Gracias a él se aprovechan mejor las reservas: el consumo de los demás pitufos pasa a ×<span data-book-ratio="rules.units.default.modifiers.0.set.foodConsumptionPerTurn" data-book-ratio-base="unit.default.foodConsumptionPerTurn"></span> su valor inicial, salvo el del Pitufo Goloso, cuyo apetito no cambia.
</p>
