<p>

Штрумф повар заботится о еде. Он может ходить, ждать, собирать урожай и сажать зерно, но не строит и не добывает материалы. С ним запасы расходуются бережнее: потребление остальных штрумфов составляет ×<span data-book-ratio="rules.units.default.modifiers.0.set.foodConsumptionPerTurn" data-book-ratio-base="unit.default.foodConsumptionPerTurn"></span> от прежнего, кроме Штрумфа обжоры, чей аппетит неизменен.
