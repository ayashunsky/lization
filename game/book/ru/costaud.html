<p>
<img src="../images/costaud.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Штрумф силач переносит ×<span data-book-ratio="unit.costaud.carryingCapacity" data-book-ratio-base="unit.default.carryingCapacity"></span> обычного груза. Его выносливость составляет ×<span data-book-ratio="unit.costaud.stamina" data-book-ratio-base="unit.default.stamina"></span>, производительность при строительстве ×<span data-book-ratio="unit.costaud.workPointsPerTurn.buildHouse" data-book-ratio-base="unit.default.workPointsPerTurn.buildHouse"></span>, а при добыче материалов ×<span data-book-ratio="unit.costaud.workPointsPerTurn.gatherMaterials" data-book-ratio-base="unit.default.workPointsPerTurn.gatherMaterials"></span> от обычной. Такая сила требует подкрепления: он съедает ×<span data-book-ratio="unit.costaud.foodConsumptionPerTurn" data-book-ratio-base="unit.default.foodConsumptionPerTurn"></span> обычного рациона.
</p>
