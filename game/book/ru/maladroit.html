Штрумф растяпа рад помочь, но всё валится у него из рук. Он может заниматься обычными делами. По сравнению с обычным штрумфом его производительность составляет ×<span data-book-ratio="unit.maladroit.workPointsPerTurn.buildHouse" data-book-ratio-base="unit.default.workPointsPerTurn.buildHouse"></span> при строительстве, ×<span data-book-ratio="unit.maladroit.workPointsPerTurn.gatherFood" data-book-ratio-base="unit.default.workPointsPerTurn.gatherFood"></span> при сборе еды и ×<span data-book-ratio="unit.maladroit.workPointsPerTurn.gatherMaterials" data-book-ratio-base="unit.default.workPointsPerTurn.gatherMaterials"></span> при добыче материалов.
</p>
