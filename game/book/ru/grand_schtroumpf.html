<h2 class="book-page-title" data-book-bind="unit.grandSchtroumpf.label"></h2>
<p>
<img src="../images/grand_schtroumpf.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Папа Штрумф руководит деревней. Он может закладывать фундаменты для транспорта и построек, кроме домов, а также изучать сложные технологии. Лаборатория увеличивает скорость его исследований в <span data-book-ratio="rules.units.types.grandSchtroumpf.modifiers.0.set.researchPointsPerTurn" data-book-ratio-base="unit.grandSchtroumpf.researchPointsPerTurn"></span> раза. На обычные деревенские дела у него нет времени.
</p>
