<h2 class="book-page-title">Счастье</h2>
<p>
<img src="../images/happiness.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Счастье отражает настроение деревни. Оно зависит от запасов еды и числа жителей. Штрумфы, которые не работают, и некоторые постройки могут его повысить.
</p>
<p>Когда счастье падает, сбор ресурсов, строительство и исследования идут медленнее.</p>
