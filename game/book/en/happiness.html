<h2 class="book-page-title">Happiness</h2>
<p>
<img src="../images/happiness.png" alt="" style="width: 30%; float: right; margin-left: 1em;">
Happiness reflects the village's mood. It changes with food reserves and population size. Smurfs who are not working and certain buildings can raise it.
</p>
<p>When happiness falls, gathering, construction, and research progress more slowly.</p>
