<h2 class="book-page-title" data-book-bind="unit.cuisinier.label"></h2>
<p>
<img src="../images/cuisinier.png" alt="" style="width: 42%; float: right; margin-left: 1em;">
Cook Smurf devotes himself to food. He can walk, wait, gather food, and plant crops, but cannot build or extract materials. His presence makes better use of the village stores: everyone else's food consumption falls to ×<span data-book-ratio="rules.units.default.modifiers.0.set.foodConsumptionPerTurn" data-book-ratio-base="unit.default.foodConsumptionPerTurn"></span> its original value, except Greedy Smurf's, whose appetite never changes.
</p>
