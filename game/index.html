<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="top-bars">
        <header class="top-bar" data-bar-mode="menu">
          <div class="top-bar-primary">
            <h1 data-role="app-title"></h1>
            <p data-role="app-subtitle"></p>
          </div>
          <div class="readouts" aria-live="polite">
            <span data-role="map-size"></span>
            <div class="zoom-controls">
              <button data-action="zoom-out" type="button">-</button>
              <span data-role="zoom-level"></span>
              <button data-action="zoom-in" type="button">+</button>
            </div>
          </div>
        </header>

        <header class="top-bar" data-bar-mode="play" hidden>
          <div class="top-bar-side top-bar-side-left">
            <button class="menu-button" data-action="toggle-game-menu" type="button" aria-haspopup="menu" aria-expanded="false"></button>
            <span data-role="file-readout"></span>
          </div>
          <div class="top-bar-title">
            <h1 data-role="app-title"></h1>
            <p data-role="app-subtitle"></p>
          </div>
          <div class="readouts" aria-live="polite">
            <div class="audio-controls" aria-label="Audio controls">
              <label class="audio-toggle-control">
                <input data-action="music-enabled" type="checkbox">
                <span class="audio-control-icon" data-role="music-toggle-label"></span>
              </label>
              <label class="audio-volume-control">
                <span class="audio-control-icon" data-role="music-volume-label"></span>
                <input class="audio-volume-input" data-action="music-volume" type="range" min="0" max="100" step="1">
              </label>
            </div>
            <div class="zoom-controls">
              <button data-action="zoom-out" type="button">-</button>
              <span data-role="zoom-level"></span>
              <button data-action="zoom-in" type="button">+</button>
            </div>
          </div>
        </header>

        <header class="top-bar" data-bar-mode="edit" hidden>
          <div class="top-bar-side top-bar-side-left">
            <button class="menu-button" data-action="toggle-game-menu" type="button" aria-haspopup="menu" aria-expanded="false"></button>
            <span data-role="file-readout"></span>
          </div>
          <div class="top-bar-title">
            <h1 data-role="app-title"></h1>
            <p data-role="app-subtitle"></p>
          </div>
          <div class="readouts" aria-live="polite">
            <span data-role="map-size"></span>
            <span data-role="hover-readout"></span>
            <div class="zoom-controls">
              <button data-action="zoom-out" type="button">-</button>
              <span data-role="zoom-level"></span>
              <button data-action="zoom-in" type="button">+</button>
            </div>
          </div>
        </header>
      </div>

      <section class="viewport">
        <canvas id="mapCanvas"></canvas>
        <div id="tileMenu" class="tile-menu" hidden>
          <p id="tileMenuTitle" class="tile-menu-title"></p>
          <div id="terrainMenuOptions" class="terrain-options" role="menu"></div>
          <div id="variantMenu" class="variant-menu" hidden>
            <p id="variantMenuTitle" class="tile-menu-title"></p>
            <div id="variantMenuOptions" class="terrain-options" role="menu"></div>
          </div>
        </div>
      </section>

      <nav id="unitActionBar" class="unit-action-bar" aria-label="Unit actions" hidden>
        <button class="unit-action-button" data-action="select-unit-action" data-unit-action="walk" type="button">
          <span aria-hidden="true">➜</span>
        </button>
        <button class="unit-action-button" data-action="select-unit-action" data-unit-action="play" type="button">
          <span aria-hidden="true">♪</span>
        </button>
        <button class="unit-action-button" data-action="select-unit-action" data-unit-action="gatherFood" type="button">
          <span aria-hidden="true">❀</span>
        </button>
        <button class="unit-action-button" data-action="select-unit-action" data-unit-action="gatherMaterials" type="button">
          <span aria-hidden="true">⚒</span>
        </button>
        <button class="unit-action-button" data-action="select-unit-action" data-unit-action="buildHouse" type="button">
          <span aria-hidden="true">⌂</span>
        </button>
        <button class="unit-action-button" data-action="select-unit-action" data-unit-action="demolish" type="button">
          <span aria-hidden="true">✕</span>
        </button>
      </nav>

      <aside id="playInspector" class="play-inspector" hidden>
        <section class="play-inspector-section play-message-section">
          <div class="situation-message-display" data-role="situation-message-display">
            <div class="situation-message-bubble" data-role="situation-message-bubble">
              <p class="situation-message-text" data-role="situation-message-text"></p>
              <div class="situation-message-nav">
                <button class="menu-button panel-icon-button" data-action="previous-situation-message" type="button">
                  <span aria-hidden="true">‹</span>
                </button>
                <button class="menu-button panel-icon-button" data-action="next-situation-message" type="button">
                  <span aria-hidden="true">›</span>
                </button>
              </div>
            </div>
            <div class="situation-speaker-column">
              <button class="menu-button panel-icon-button message-visibility-button" data-action="toggle-situation-message" type="button">
                <span class="message-visibility-icon" data-role="situation-message-toggle-label" aria-hidden="true">👁</span>
              </button>
              <img
                class="situation-speaker-head"
                data-role="situation-speaker-head"
                src="assets/ui/lunettes_head.png"
                alt=""
              >
            </div>
          </div>
        </section>
        <span class="play-inspector-turn" data-role="turn-readout"></span>
        <section class="play-inspector-section">
          <p class="play-inspector-title" data-role="stores-title"></p>
          <div class="resource-strip">
            <div class="resource-item">
              <canvas class="resource-canvas" data-role="resource-stone-canvas" width="88" height="56"></canvas>
              <span class="resource-caption" data-role="resource-stone-caption"></span>
            </div>
            <div class="resource-item">
              <canvas class="resource-canvas" data-role="resource-lumber-canvas" width="88" height="56"></canvas>
              <span class="resource-caption" data-role="resource-lumber-caption"></span>
            </div>
            <div class="resource-item">
              <canvas class="resource-canvas" data-role="resource-food-canvas" width="88" height="56"></canvas>
              <span class="resource-caption" data-role="resource-food-caption"></span>
            </div>
          </div>
        </section>
        <section class="play-inspector-section">
          <p class="play-inspector-title" data-role="tile-inspector-title"></p>
          <div class="panel-lines">
            <div class="tile-info-row">
              <div class="tile-info-item" data-role="tile-info-primary" hidden>
                <canvas class="tile-info-canvas" data-role="tile-info-primary-canvas" width="88" height="56"></canvas>
                <span class="tile-info-caption" data-role="tile-info-primary-caption"></span>
              </div>
              <div class="tile-info-item" data-role="tile-info-secondary" hidden>
                <canvas class="tile-info-canvas" data-role="tile-info-secondary-canvas" width="88" height="56"></canvas>
                <span class="tile-info-caption" data-role="tile-info-secondary-caption"></span>
              </div>
            </div>
          </div>
        </section>
        <section class="play-inspector-section">
          <div class="unit-inspector-layout">
            <div class="unit-inspector-main">
              <div class="play-inspector-header-row">
                <p class="play-inspector-title" data-role="unit-title"></p>
                <button class="menu-button panel-icon-button" data-action="select-next-unit" type="button">
                  <span aria-hidden="true">»</span>
                </button>
              </div>
              <div class="panel-lines">
                <div class="unit-action-summary" data-role="unit-task-row" hidden>
                  <img class="unit-action-sprite" data-role="unit-action-sprite" alt="">
                  <span class="unit-action-progress" data-role="unit-action-progress"></span>
                  <button class="menu-button panel-icon-button" data-action="cancel-unit-task" type="button">
                    <span aria-hidden="true">✕</span>
                  </button>
                </div>
              </div>
            </div>
            <button class="unit-book-button" data-action="open-book-overlay" type="button">
              <img class="unit-book-image" src="assets/ui/book.png" alt="">
            </button>
          </div>
        </section>
        <div class="play-inspector-footer">
          <button class="menu-button" data-action="next-turn" type="button"></button>
          <label class="toggle-control">
            <input data-action="auto-pass" type="checkbox">
            <span data-role="auto-pass-label"></span>
          </label>
        </div>
      </aside>

      <div id="bookOverlay" class="book-overlay" hidden>
        <section class="book-panel" role="dialog" aria-modal="true">
          <button class="menu-button book-panel-close" data-action="close-book-overlay" type="button">
            <span aria-hidden="true">✕</span>
          </button>

                  <span aria-hidden="true">‹</span>
                </button>
                <button class="menu-button book-turn-button" data-action="turn-book-page-next" type="button">
                  <span aria-hidden="true">›</span>
                </button>

      </div>

      <div id="gameActionMenu" class="game-action-menu" role="menu" hidden>
        <button class="game-action-item" data-action="new-random-map" type="button" role="menuitem" hidden></button>
        <button class="game-action-item" data-action="new-empty-map" type="button" role="menuitem" hidden></button>
        <button class="game-action-item" data-action="load-state" type="button" role="menuitem"></button>
        <button class="game-action-item" data-action="save-state" type="button" role="menuitem"></button>
        <button class="game-action-item" data-action="save-state-as" type="button" role="menuitem"></button>
        <button class="game-action-item" data-action="main-menu" type="button" role="menuitem"></button>
      </div>

      <div id="saveSlotOverlay" class="slot-overlay" hidden>
        <section id="saveSlotPanel" class="slot-panel" role="dialog" aria-modal="true" aria-labelledby="saveSlotTitle">
          <div class="slot-panel-header">
            <p id="saveSlotTitle" class="slot-panel-title"></p>
            <button class="menu-button slot-panel-close" data-action="close-slot-panel" type="button" aria-label="Close">×</button>
          </div>
          <label class="slot-panel-field">
            <span data-role="slot-name-label"></span>
            <input id="saveSlotInput" class="slot-panel-input" data-role="slot-name-input" type="text" autocomplete="off" spellcheck="false">
          </label>
          <div class="slot-panel-actions">
            <button class="menu-button" data-action="confirm-slot-panel" type="button"></button>
            <button class="menu-button" data-action="import-slot-panel" type="button" hidden></button>
            <button class="menu-button" data-action="cancel-slot-panel" type="button"></button>
          </div>
          <div class="slot-panel-list-wrap">
            <p class="slot-panel-subtitle" data-role="slot-list-title"></p>
            <div id="saveSlotList" class="slot-panel-list" role="listbox"></div>
            <p id="saveSlotEmpty" class="slot-panel-empty" hidden></p>
          </div>
        </section>
      </div>

      <div id="mainMenuOverlay" class="main-menu-overlay" role="dialog" aria-modal="true">
        <div class="main-menu-loading" data-role="main-menu-loading" hidden></div>
        <div class="main-menu">
          <ul class="main-menu-list">
            <li><button class="main-menu-item" type="button" data-menu-action="watch-intro"></button></li>
            <li><button class="main-menu-item" type="button" data-menu-action="start-new-game"></button></li>
            <li><button class="main-menu-item" type="button" data-menu-action="play"></button></li>
            <li><button class="main-menu-item" type="button" data-menu-action="load-game"></button></li>
            <li><button class="main-menu-item" type="button" data-menu-action="edit"></button></li>
            <li><button class="main-menu-item" type="button" data-menu-action="import-export"></button></li>
          </ul>
          <div class="main-menu-footer">
            <div class="language-selector" data-role="language-selector" role="group">
              <button class="language-option-button" data-action="set-language" data-language="fr" type="button">
                <span aria-hidden="true">🇫🇷</span>
              </button>
              <button class="language-option-button" data-action="set-language" data-language="en" type="button">
                <span aria-hidden="true">🇬🇧</span>
              </button>
              <button class="language-option-button" data-action="set-language" data-language="es" type="button">
                <span aria-hidden="true">🇪🇸</span>
              </button>
              <button class="language-option-button" data-action="set-language" data-language="ru" type="button">
                <span aria-hidden="true">🇷🇺</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="rules.js"></script>
    <script src="strings.js"></script>
    <script src="app.js"></script>
  </body>
</html>
